# Git hooks (lefthook via mise). Hooks run in parallel where safe.

# Conventional-Commits check on the message (config in committed.toml).
commit-msg:
  commands:
    committed:
      run: mise exec -- committed --commit-file {1}

pre-commit:
  parallel: true
  commands:
    format-check:
      glob: "*.{cs,csproj,props,targets,slnx,xaml}"
      run: mise exec -- dotnet format Alarm.slnx --include {staged_files} --verify-no-changes
    typos:
      # Whitelist textual types so binaries and deletions are filtered out.
      glob: "*.{cs,csproj,props,targets,slnx,xaml,xml,md,yml,yaml,json,toml,sh,ps1,gitignore,gitattributes,editorconfig}"
      run: mise exec -- typos --no-check-filenames {staged_files}

pre-push:
  commands:
    # Full test suite (transitively builds) before pushing.
    test:
      run: mise exec -- just test
