# Release proposals and drafts follow docs/adr/0001-automated-versioning-with-release-please.md.

name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a release-cut in flight; only one runs per ref anyway.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    if: >-
      github.repository_id == '1251003903' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Credential delivery follows docs/credential-delivery.md.
    environment: release-please
    permissions:
      contents: read  # The App token authorizes release proposals and drafts.
      actions: write  # Dispatch release.yml after creating a draft release.
    env:
      HAS_APP: >-
        ${{ secrets.RELEASE_PLEASE_CLIENT_ID != '' ||
        secrets.RELEASE_PLEASE_PRIVATE_KEY != '' }}
      APP_INPUTS_VALID: >-
        ${{ secrets.RELEASE_PLEASE_CLIENT_ID != '' &&
        !startsWith(secrets.RELEASE_PLEASE_CLIENT_ID, '${') &&
        secrets.RELEASE_PLEASE_PRIVATE_KEY != '' &&
        !startsWith(secrets.RELEASE_PLEASE_PRIVATE_KEY, '${') }}
    steps:
      - name: Reject missing or unresolved automation credentials
        if: env.HAS_APP == 'true' && env.APP_INPUTS_VALID != 'true'
        shell: bash
        run: exit 1

      - name: Mint GitHub App token
        id: app-token
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: windows-loud-alarm
          permission-contents: write
          permission-pull-requests: write

      - name: release-please (active)
        id: rp
        if: env.HAS_APP == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Drafts require explicit dispatch under docs/adr/0001-automated-versioning-with-release-please.md.
      - name: Trigger the release build
        if: ${{ env.HAS_APP == 'true' && steps.rp.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.rp.outputs.tag_name }}
          SHA: ${{ steps.rp.outputs.sha }}
        run: |
          gh workflow run release.yml --repo "$REPO" --ref main \
            -f tag_name="$TAG" -f sha="$SHA" -f publish=true

      - name: release-please (dormant — App not configured)
        if: env.HAS_APP != 'true'
        run: |
          echo "::notice::release-please is dormant — set the RELEASE_PLEASE_CLIENT_ID and"
          echo "RELEASE_PLEASE_PRIVATE_KEY secrets (a GitHub App) to activate."
          echo "See docs/RELEASING.md and docs/adr/0001-automated-versioning-with-release-please.md."
