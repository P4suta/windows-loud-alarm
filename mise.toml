[tools]
just = "1.59.0"
lefthook = "2.2.2"
typos = "latest"
# Drives the SubsetFonts target (uv brings its own Python on demand).
uv = "latest"
# Conventional-Commits linter for the commit-msg hook (see committed.toml).
"cargo:committed" = "1"
# Lints .github/workflows/*.yml; pinned so workflow edits validate locally.
"github:rhysd/actionlint" = "1.7.12"

[env]
# Persistent MSBuild server — avoids a fresh msbuild.exe per dotnet call.
MSBUILDUSESERVER = "1"
# Opt out of Microsoft.Testing.Platform telemetry.
TESTINGPLATFORM_TELEMETRY_OPTOUT = "1"

[settings]
idiomatic_version_file_enable_tools = ["dotnet"]
# Fetch cargo: backend tools as prebuilt binaries (no Rust compile on install).
cargo.binstall = true
