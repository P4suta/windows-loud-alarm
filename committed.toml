# Conventional Commits for the lefthook commit-msg hook, keeping release-please's
# version + CHANGELOG derivation well-formed. The authoritative gate for squash-merges
# is the PR-title check (amannn/action-semantic-pull-request in ci.yml); this is the
# earlier local signal. committed skips fixup!/merge commits, so rebases still work.
style = "conventional"
# Lowercase subjects, matching the PR-title gate and git history.
subject_capitalized = false
# No length cap — subjects come from squash-merged PR titles.
subject_length = 0
line_length = 0
# Types CONTRIBUTING.md documents and the PR-title gate accepts (committed's default
# set omits ci/build/deps/revert).
allowed_types = [
  "feat",
  "fix",
  "perf",
  "docs",
  "refactor",
  "test",
  "chore",
  "ci",
  "build",
  "deps",
  "style",
  "revert",
]
