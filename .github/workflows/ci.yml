name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Verify change scope and whitespace
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the event commits and classify the complete diff
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in pull_request|merge_group) ;; *) exit 1 ;; esac
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          [[ "$(git rev-parse HEAD)" == "$HEAD_SHA" ]]
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          git diff --raw --no-abbrev --no-renames -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/ci-diff.raw"
          docs_only=$(jq -Rrs '
            split("\u0000")
            | if length < 3 or .[-1] != "" or (length - 1) % 2 != 0
              then error("Invalid or empty Git diff") else .[0:-1] end
            | [range(0; length; 2) as $i
               | .[$i] as $header
               | .[$i + 1] as $path
               | ($header | capture("^:(?<old_mode>[0-7]{6}) (?<new_mode>[0-7]{6}) (?<old>[0-9a-f]{40}) (?<new>[0-9a-f]{40}) (?<status>[A-Z][0-9]*)$")
                  // error("Invalid Git diff record")) as $entry
               | {documentation: ([
                    "README.md", "CONTRIBUTING.md", "CHANGELOG.md",
                    ".github/PULL_REQUEST_TEMPLATE.md", ".github/SECURITY.md",
                    "docs/ARCHITECTURE.md", "docs/RELEASING.md", "docs/SIGNING.md",
                    "docs/credential-delivery.md", "docs/perf/README.md",
                    "docs/adr/0001-automated-versioning-with-release-please.md"] | index($path) != null),
                  regular: ([
                    ["M", "100644", "100644"],
                    ["A", "000000", "100644"],
                    ["D", "100644", "000000"]]
                    | any(.[]; . == [$entry.status, $entry.old_mode, $entry.new_mode]))}]
            | all(.[]; .documentation and .regular)
          ' "$RUNNER_TEMP/ci-diff.raw")
          case "$docs_only" in true|false) ;; *) exit 1 ;; esac
          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"

  build-test:
    name: build + test + format (Windows)
    needs: [changes]
    if: needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'false'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MSBUILDUSESERVER: "1"
      TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up mise (pins dotnet 10.0.300 + just)
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: true
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore (locked-mode)
        run: mise exec -- just restore
      - name: Build (strict analyzers)
        run: mise exec -- just build
      - name: Test (MTP exes, parallel collections)
        run: mise exec -- just test-fast
      - name: Format check
        run: mise exec -- just format-check

  pr-title:
    name: Check pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read # Read the pull request title.
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            refactor
            test
            chore
            ci
            build
            deps
            style
            revert

  release-gate:
    name: Check release approval
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # Read the release approval labels.
    steps:
      - name: Require an explicit approval label on a Release PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          labels=$(gh pr view "$PR" --repo "$REPO" --json labels -q '.labels[].name')
          if echo "$labels" | grep -qx "autorelease: pending"; then
            if echo "$labels" | grep -qx "release: approved"; then
              echo "Release PR carries 'release: approved' — gate open."
            else
              echo "::error::This is a release PR. Add the 'release: approved' label to allow merge (deliberate release; docs/RELEASING.md)."
              exit 1
            fi
          else
            echo "Not a release PR — gate passes."
          fi

  required:
    name: required
    if: always()
    needs: [changes, build-test, pr-title, release-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful checks for the verified change scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          NEEDS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg event "$EVENT_NAME" '
            (keys | sort) == (["changes", "build-test", "pr-title", "release-gate"] | sort)
            and .changes.result == "success"
            and (if .changes.outputs.docs_only == "true" then .["build-test"].result == "skipped"
                 elif .changes.outputs.docs_only == "false" then .["build-test"].result == "success"
                 else false end)
            and (if $event == "pull_request" then
                   .["pr-title"].result == "success" and .["release-gate"].result == "success"
                 elif $event == "merge_group" then
                   .["pr-title"].result == "skipped" and .["release-gate"].result == "skipped"
                 else false end)
          ' <<< "$NEEDS"
